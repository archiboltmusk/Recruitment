name: Daily Recruitment Crawler & Health Check

on:
  schedule:
    # Runs everyday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  crawl_and_verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Link Verification Suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "
          from app.database import engine, Base, SessionLocal
          from app.collector import VacancyCollector
          from app.scraper import LiveGazetteScraper
          from app.notifier import Notifier
          Base.metadata.create_all(bind=engine)
          db = SessionLocal()
          res = VacancyCollector.sync_sample_feed(db)
          live = LiveGazetteScraper.sync_live_portals(db)
          digest = Notifier.broadcast_daily_digest(db)
          print('Sync completed:', res, 'Live portals:', live, 'Digest:', digest)
          "
